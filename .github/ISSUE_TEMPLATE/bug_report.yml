name: Bug report
description: Something in engram behaves incorrectly
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        **Do not report security vulnerabilities here** — use a
        [private security advisory](https://github.com/mariesqu/engram/security/advisories/new)
        instead (see [SECURITY.md](https://github.com/mariesqu/engram/blob/main/SECURITY.md)).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behavior you observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands or MCP tool calls, in order.
      placeholder: |
        1. engram serve --db ./engram.db
        2. Call mem_save with ...
        3. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: engram version
      description: Output of `engram version`.
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: OS and architecture (e.g. Windows 11 amd64, Ubuntu 24.04 amd64, macOS 15 arm64).
    validations:
      required: true

  - type: dropdown
    id: mcp-client
    attributes:
      label: MCP client
      options:
        - Claude Code
        - Other (please specify below)
        - Not applicable (CLI or web UI only)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: >
        Daemon output, MCP client logs, or CLI stderr. Redact anything sensitive —
        writer keys and API keys must never appear in an issue.
      render: shell
    validations:
      required: false
