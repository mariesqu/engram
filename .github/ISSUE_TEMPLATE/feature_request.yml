name: Feature request
description: Suggest a capability or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing, it helps to skim [CONTRIBUTING.md](https://github.com/mariesqu/engram/blob/main/CONTRIBUTING.md)
        — notably the pure-Go / no-CGO and no-Docker-in-the-test-path ground rules.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that engram makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should engram do instead? Describe the behavior, not the implementation, if you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, including workarounds you use today.
    validations:
      required: false
